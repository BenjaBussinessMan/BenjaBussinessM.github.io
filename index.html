<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stalin Bonilla | Data Engineer</title>
  <meta name="description" content="Portafolio de Stalin Bonilla, Senior Data Engineer y AI Specialist: Data Lakehouse, pipelines, MLOps y gobernanza de datos.">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang") || (navigator.language || "es").slice(0, 2);
        document.documentElement.lang = l === "en" ? "en" : "es";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#inicio">SB</a>
    <nav>
      <a href="#sobre-mi" data-i18n="nav.about"></a>
      <a href="#proyectos" data-i18n="nav.projects"></a>
      <a href="#habilidades" data-i18n="nav.skills"></a>
      <a href="#educacion" data-i18n="nav.education"></a>
      <a href="#contacto" data-i18n="nav.contact"></a>
    </nav>
    <div class="tools">
      <div class="lang-switch" role="group" data-i18n-aria="lang.label" data-i18n-tip="lang.label">
        <button type="button" data-lang="es">Español</button>
        <button type="button" data-lang="en">English</button>
      </div>
      <button id="theme-toggle" class="icon-btn" data-i18n-aria="theme.toggle" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="inicio" class="hero">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="actions">
        <a class="btn primary" href="#proyectos" data-i18n="hero.cta.projects"></a>
        <a class="btn" href="#contacto" data-i18n="hero.cta.contact"></a>
      </div>
      <dl class="stats">
        <div><dt data-i18n="stats.years"></dt><dd>4+</dd></div>
        <div><dt data-i18n="stats.records"></dt><dd>1M+</dd></div>
        <div><dt data-i18n="stats.query"></dt><dd>40%</dd></div>
      </dl>
    </section>

    <section id="sobre-mi">
      <h2 data-i18n="about.title"></h2>
      <div class="two-col">
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
    </section>

    <section id="proyectos">
      <h2 data-i18n="projects.title"></h2>
      <div id="project-list" class="grid"></div>
    </section>

    <section id="habilidades">
      <h2 data-i18n="skills.title"></h2>
      <div id="skill-list" class="skills"></div>
    </section>

    <section id="educacion">
      <h2 data-i18n="education.title"></h2>
      <ul id="education" class="edu"></ul>
    </section>

    <section id="contacto">
      <h2 data-i18n="contact.title"></h2>
      <p data-i18n="contact.text"></p>
      <div class="actions">
        <a class="btn primary" href="mailto:stalin.bonilla23@gmail.com">stalin.bonilla23@gmail.com</a>
        <a class="btn" href="https://www.linkedin.com/in/stalin-benjamin-bonilla-2a4361b4" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" href="https://github.com/BenjaBussinessMan" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Stalin Bonilla</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
